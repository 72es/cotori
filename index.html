<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>cotori</title>
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="cotori">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a calm, title-first reading list (≈40em) on warm paper; tap a title to open the full card. Header (logo, size, categories) is frozen; tab bar fixed. Same type family and sizes as Varys. */
:root{
  --paper:#faf8f4; --card:#ffffff; --ink:#2a2b28; --ink-2:#55574f; --ink-3:#8b8d84; --ink-read:#adafa6;
  --rule:#e8e4dc; --wash:#f2efe8;
  --accent:#5f7356; --accent-ink:#ffffff; --accent-wash:#e9eee3;
  --sun:#c9893b; --sun-ink:#ffffff; --sun-wash:#f7ecdc;
  --star:#dcd6ca; --star-on:#c9893b;
  --bar:rgba(250,248,244,.9); --shadow:0 1px 2px rgba(60,55,40,.04),0 6px 24px rgba(60,55,40,.06);
  --sans:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  --col:40em; --scale:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171816; --card:#1f201d; --ink:#ecebe6; --ink-2:#bdbcb3; --ink-3:#8e8e85; --ink-read:#64655f;
  --rule:#2e2f2b; --wash:#242521;
  --accent:#a9c09b; --accent-ink:#171816; --accent-wash:#27302a;
  --sun:#e0ad6b; --sun-ink:#171816; --sun-wash:#33291c; --star:#3a3b36; --star-on:#e0ad6b;
  --bar:rgba(23,24,22,.9); --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171816; --card:#1f201d; --ink:#ecebe6; --ink-2:#bdbcb3; --ink-3:#8e8e85; --ink-read:#64655f;
  --rule:#2e2f2b; --wash:#242521;
  --accent:#a9c09b; --accent-ink:#171816; --accent-wash:#27302a;
  --sun:#e0ad6b; --sun-ink:#171816; --sun-wash:#33291c; --star:#3a3b36; --star-on:#e0ad6b;
  --bar:rgba(23,24,22,.9); --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.75;letter-spacing:.01em;-webkit-font-smoothing:antialiased;line-break:strict;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:pretty;margin:0}
.bird{fill:var(--paper);stroke:currentColor;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}

/* frozen header — px sizes so A−/A+ never makes it taller */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--col);margin:0 auto}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:6px;flex:1;color:var(--ink)}
.logo svg{width:32px;height:34px}
.logo b{font-weight:500;font-size:25px;letter-spacing:.02em;line-height:1}
.scaler{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;font-size:14px;background:var(--card)}
.scaler button{border:0;background:none;min-width:40px;min-height:34px;cursor:pointer;font-weight:700}
.scaler button:disabled{opacity:.35}
.scaler output{display:grid;place-items:center;min-width:44px;font-size:12px;color:var(--ink-3);border-inline:1px solid var(--rule);font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--rule);background:var(--card);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-size:14px;padding:5px 14px;border-radius:999px;background:var(--wash);color:var(--ink-2);line-height:1.6}
.chips a.on{background:var(--accent);color:var(--accent-ink)}

main{max-width:var(--col);margin:0 auto}

/* pull to refresh */
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--accent);transition:height .2s}
.ptr svg{width:40px;height:42px}
.ptr .w2{display:none}
.ptr.flap .w1{animation:f1 .36s steps(1) infinite}.ptr.flap .w2{display:inline;animation:f2 .36s steps(1) infinite}
@keyframes f1{0%{opacity:1}50%{opacity:0}}@keyframes f2{0%{opacity:0}50%{opacity:1}}

/* intro */
.intro{padding-block:24px 4px}
.intro .date{font-size:.8125rem;color:var(--ink-3);letter-spacing:.06em}
.intro h1{font-size:1.625rem;font-weight:900;line-height:1.4;margin:4px 0 8px}
.intro p{margin:0;font-size:1rem;line-height:1.85;color:var(--ink-2)}
.notice{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--sun-wash);color:var(--ink);font-size:.9375rem;display:flex;gap:10px;align-items:center;cursor:pointer;border:0;width:100%;text-align:left}
.box{margin-top:20px;padding:18px 20px 14px;border-radius:20px;background:var(--accent-wash)}
.box .k{font-size:.75rem;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.keys ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px;counter-reset:k}
.keys li{display:grid;grid-template-columns:1.5rem 1fr;font-size:1rem;line-height:1.75;counter-increment:k}
.keys li::before{content:counter(k);font-size:.8125rem;font-weight:700;color:var(--accent);padding-top:.25em}
.weekly{background:var(--sun-wash)}
.weekly .k{color:var(--sun)}
.weekly .list{margin-top:6px}

/* sections and title rows */
.sec{padding-top:30px;scroll-margin-top:110px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-h h2{font-size:1.375rem;font-weight:900}
.sec-h .c{font-size:.8125rem;color:var(--ink-3)}
.sec-empty{padding:14px 0;color:var(--ink-3);font-size:.9375rem}
.list{display:grid}
.row{border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 118px)}
.qa-list .row{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.rt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 2px;-webkit-tap-highlight-color:transparent}
.rt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.rt .t{flex:1;min-width:0;font-size:1.0625rem;font-weight:700;line-height:1.6;color:var(--ink)}
.row.read .rt .t{color:var(--ink-read);font-weight:500}
.rt .mins{flex:none;font-size:.75rem;color:var(--ink-3);padding-top:.3em;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.read .rt .mins{visibility:hidden}
.mk{flex:none;width:11px;height:16px;margin-top:.35em;color:var(--sun)}
.row.open .rt{padding-bottom:6px}

/* expanded card */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 16px;margin:0 0 16px;position:relative}
.card .flag{position:absolute;top:-1px;right:18px;width:14px;height:22px;color:var(--sun)}
.byline{font-size:.8125rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 12px;margin:0 0 12px}
.byline .src{font-weight:700;color:var(--ink-2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;cursor:pointer;flex-basis:100%}
.byline .src.full{display:block}
.orig{font-size:.875rem;color:var(--ink-3);margin:0 0 10px;line-height:1.5}
.prose{font-size:1.0625rem;line-height:1.9;margin:0 0 14px}
.why{border-radius:14px;background:var(--accent-wash);padding:12px 14px;margin:0 0 14px;font-size:1rem;line-height:1.85}
.why .owl{float:left;font-size:1.5rem;line-height:1;margin:.12em .35em 0 0}
.why::after{content:"";display:block;clear:both}
.act{border-radius:14px;background:var(--sun-wash);padding:12px 14px;margin:0 0 14px;font-size:.9375rem;font-weight:700}
.act .tl{color:var(--sun);margin-right:6px}
.note{font-size:.8125rem;color:var(--ink-3);margin:8px 0 0}
details.more{border-top:1px dashed var(--rule);margin-top:6px}
details.more summary{cursor:pointer;list-style:none;padding:12px 0;font-size:.9375rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"＋";font-weight:400;color:var(--ink-3)}
details.more[open] summary::after{content:"－"}
details.more ul{margin:0 0 12px;padding-left:1.1em;display:grid;gap:10px;font-size:1rem;line-height:1.85}
.watch{font-size:.9375rem;color:var(--ink-2);margin:0 0 8px}
.fb{margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule);display:grid;gap:10px}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.875rem}
.omin{font-size:.8125rem;color:var(--ink-3);margin-left:-2px}
.link-out{text-decoration:none;font-weight:700;border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.rate{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.savebtn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 12px;min-height:38px;white-space:nowrap;cursor:pointer;font-size:.875rem;font-weight:700}
.savebtn svg{width:11px;height:15px}
.savebtn[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.stars{display:flex;align-items:center}
.stars .l{font-size:.875rem;color:var(--ink-2);margin-right:2px;font-weight:700;white-space:nowrap}
.star{border:0;background:none;padding:0;min-width:30px;min-height:44px;font-size:21px;line-height:1;color:var(--star);cursor:pointer;transition:color .15s,transform .15s}
.star.on{color:var(--star-on)}
.star:active{transform:scale(1.2)}
.wk-s{flex:none;font-size:.75rem;color:var(--sun);padding-top:.3em;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:46px;resize:vertical;border:1px solid var(--rule);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:.9375rem;line-height:1.6}
textarea::placeholder{color:var(--ink-3)}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer;font-size:.875rem;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sent{font-size:.75rem;color:var(--accent)}

.ask{margin-top:32px;padding:22px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:grid;gap:10px}
.ask h2{font-size:1.1875rem;font-weight:900}
.ask p{margin:0;font-size:.9375rem;color:var(--ink-2);line-height:1.8}
.foot{font-size:.75rem;color:var(--ink-3);padding-block:28px;line-height:1.8}
.view-h{font-size:1.5rem;font-weight:900;padding-top:22px}
.view-sub{color:var(--ink-2);font-size:.9375rem;margin:6px 0 4px}
.pend{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--sun-wash);font-size:.9375rem}
.pend .k{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--sun);margin-bottom:4px}
.pend p{margin:4px 0 0}
.qa-list{margin-top:18px}
.thread .th .t{font-weight:900}
.thread .chev{flex:none;color:var(--ink-3);padding-top:.15em}
.list.sub{padding-left:14px;border-left:2px solid var(--rule);margin:0 0 10px 4px}
.qa.mine{box-shadow:var(--shadow),inset 0 0 0 2px var(--sun-wash)}
.empty{padding:32px 0;color:var(--ink-3);font-size:.9375rem;line-height:1.8}
.empty b{display:block;font-size:1.125rem;color:var(--ink);margin-bottom:4px}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(30,28,22,.35);display:grid;align-items:end;justify-items:center}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;overflow-x:hidden;grid-template-columns:minmax(0,1fr);background:var(--paper);border-radius:24px 24px 0 0;
  padding:26px max(22px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet h2{font-size:1.5rem;font-weight:900}
.sheet p{margin:0;color:var(--ink-2)}
.sheet label.f{display:grid;gap:6px;font-size:.875rem;font-weight:700;min-width:0}
.sheet input[type=text]{min-width:0;width:100%;border:1px solid var(--rule);border-radius:12px;background:var(--card);padding:12px 14px;font-size:1.0625rem}
.picks{display:grid;gap:8px}
.pick{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--rule);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60}

/* tab bar (fixed px, never scaled) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--rule);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;cursor:pointer;display:grid;place-items:center;gap:2px;padding:8px 0 6px;font-size:12px;line-height:1.3;color:var(--ink-3);min-height:58px;position:relative}
.tab svg{width:26px;height:28px}
.tab .ic{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab .q{font-size:20px;line-height:24px;filter:grayscale(1);opacity:.55}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"] .q{filter:none;opacity:1}
.badge{position:absolute;top:4px;left:calc(50% + 10px);background:var(--sun);color:var(--sun-ink);font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
.dot{position:absolute;top:8px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--sun)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out both}@keyframes in{from{opacity:.001;transform:translateY(-4px)}to{opacity:1;transform:none}}}
/* rich text blocks: paragraphs, lists, tables inside summary / why */
.blk p{margin:0 0 14px}
.prose.blk>*:last-child,.why .blk>*:last-child{margin-bottom:0}
.blk ul.bl{margin:0 0 14px;padding-left:1.15em;display:grid;gap:6px}
.blk ul.bl li{line-height:1.75}
.blk .tb{margin:4px 0 16px;border-top:2px solid var(--ink)}
.blk .tb-cap{font-size:.8125rem;font-weight:700;color:var(--ink-3);margin:8px 0 2px;line-height:1.5}
.blk .tb-r{padding:9px 0;border-bottom:1px solid var(--rule)}
.blk .tb-h{margin:0 0 2px;font-weight:700;font-size:1rem;line-height:1.6}
.blk .tb-c{margin:0;font-size:.9375rem;line-height:1.7;display:grid;grid-template-columns:5.5em 1fr;gap:8px}
.blk .tb-c span{color:var(--ink-3);font-size:.8125rem;padding-top:.15em}
.blk .tb2{display:grid;grid-template-columns:minmax(5em,auto) 1fr;column-gap:14px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.9375rem;line-height:1.7}
.blk .tb2 b{font-weight:700}
.why .blk .tb{border-top-color:var(--accent)}
details.more li b{font-weight:700}
/* sync: PIN boxes, privacy note */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:10px 0;font-size:.9375rem;font-weight:700;color:var(--ink-2);cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sheet .fl{display:grid;gap:6px;font-size:.875rem;font-weight:700}
.sheet .pin{display:flex;gap:10px}
.sheet .pin input{flex:none;box-sizing:border-box;width:60px;height:60px;padding:0;text-align:center;font-size:1.5rem;font-weight:700;border:1px solid var(--rule);border-radius:14px;background:var(--card);color:var(--ink)}
.sheet .pin input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.priv{background:var(--accent-wash);border-radius:14px;padding:12px 14px;font-size:.875rem;line-height:1.75;color:var(--ink-2)}
.priv b{color:var(--ink)}.priv ul{margin:6px 0 0;padding-left:1.1em}
.sheet .sm{font-size:.8125rem;color:var(--ink-3)}
.lk{color:var(--ink-2);text-decoration:underline;font-size:.875rem;background:none;border:0;padding:6px 0;cursor:pointer;justify-self:center}
.syst{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.875rem;color:var(--ink-2)}
.syst .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px}
.syst .dot.off{background:var(--ink-read)}
</style>
</head>

<script>
// 回饋送到 Google 試算表的網址
const FEEDBACK_URL = 'https://script.google.com/macros/s/AKfycbxthCyDDZmKU-yw5LyLroFL4pBnCrmg8xPOhjiL16ceJFZ9eQCfEfdwroraGX44tanE/exec';
const SKIP_MAX = 5, HOME_DAYS = 3, KEEP_DAYS = 30;

(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} if(window.__cotoriSyncHook) window.__cotoriSyncHook(k);}};
let D=null;
const S={svt:ls.get('k-svt',{}),svdel:ls.get('k-svdel',{}),prefsT:ls.get('k-prefs-t',0),name:ls.get('k-name',''),secs:ls.get('k-secs',null),fb:ls.get('k-fb',{}),read:ls.get('k-read',{}),saved:ls.get('k-saved',{}),asked:ls.get('k-asked',[]),open:{},thOpen:{},view:'home'};

/* dates in Taipei */
const tpe=d=>new Date(new Date(d).toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
function today(){const t=tpe(Date.now());return Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())}
const age=it=>Math.round((today()-Date.parse((it.pub||it.date||'').replace(/\//g,'-')+'T00:00:00Z'))/864e5);

/* font scale */
const STEPS=[.875,1,1.125,1.25,1.375,1.5,1.75];
let si=STEPS.indexOf(Number(ls.get('k-scale',1))); if(si<0) si=1;
function applyScale(){document.documentElement.style.setProperty('--scale',STEPS[si]);$('#zVal').textContent=Math.round(STEPS[si]*100)+'%';$('#zOut').disabled=si===0;$('#zIn').disabled=si===STEPS.length-1;ls.set('k-scale',STEPS[si]);}
$('#zIn').onclick=()=>{if(si<STEPS.length-1){si++;applyScale();}};
$('#zOut').onclick=()=>{if(si>0){si--;applyScale();}};
applyScale();
/* two-finger pinch changes the text size instead of zooming the page, so the top and bottom bars stay put */
let pd=null;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchstart',e=>{pd=e.touches.length===2?dist(e.touches):null},{passive:true});
document.addEventListener('touchmove',e=>{ if(e.touches.length!==2) return; e.preventDefault(); if(!pd){pd=dist(e.touches);return}
  const r=dist(e.touches)/pd;
  if(r>1.18&&si<STEPS.length-1){si++;applyScale();pd=dist(e.touches)}
  else if(r<.85&&si>0){si--;applyScale();pd=dist(e.touches)} },{passive:false});
document.addEventListener('touchend',e=>{if(e.touches.length<2) pd=null},{passive:true});

/* outbox: kept on the phone, sent when online. Reading events carry no name. */
const ANON=['read','open_skip','open_source','save'];
function send(rec){const base={sid:Date.now().toString(36)+Math.random().toString(36).slice(2,7),edition:D?D.edition.id:''};
  if(!ANON.includes(rec.type)) base.name=S.name;
  const q=ls.get('k-queue',[]);q.push(Object.assign(base,rec));ls.set('k-queue',q.slice(-300));flush();return base.sid;}
let flushing=false;
async function flush(){ if(flushing||!FEEDBACK_URL||!navigator.onLine) return; flushing=true;
  let q=ls.get('k-queue',[]);
  while(q.length){try{await fetch(FEEDBACK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(q[0])});}catch(e){break}
    q.shift();ls.set('k-queue',q);}
  flushing=false; }
addEventListener('online',flush);

/* lists */
const secOn=id=>!S.secs||S.secs.includes(id);
const allIt=()=>D.items.concat(D.qa||[]);
const byId=id=>allIt().find(i=>i.id===id)||S.saved[id];
const sortNew=a=>a.slice().sort((x,y)=>String(y.pub||y.date).localeCompare(String(x.pub||x.date)));
function homeItems(){const r=D.items.filter(i=>age(i)<HOME_DAYS);
  const skip=sortNew(r.filter(i=>i.sec==='skip')).slice(0,SKIP_MAX);return r.filter(i=>i.sec!=='skip').concat(skip)}
const olderItems=()=>D.items.filter(i=>{const a=age(i);return a>=HOME_DAYS&&a<=KEEP_DAYS&&!S.saved[i.id]});
const savedItems=()=>Object.keys(S.saved).map(id=>allIt().find(i=>i.id===id)||S.saved[id]);
/* 路過 and ARTs are optional reading, so they never count as unread on the home tab */
const unreadCount=()=>homeItems().filter(i=>i.sec!=='skip'&&i.sec!=='design'&&secOn(i.sec)&&!S.read[i.id]).length;

/* reading time of our own summary (what people actually read), about 400 Chinese characters a minute */
/* text blocks: a string (blank line = new paragraph) or an array of strings / {list:[]} / {table:{cap,cols,rows}} */
function blocks(v){ if(v==null) return []; if(!Array.isArray(v)) v=[v]; const out=[];
  v.forEach(b=>{ if(typeof b==='string') String(b).split(/\n\s*\n/).forEach(p=>{p=p.trim(); if(p) out.push(p)}); else if(b) out.push(b); }); return out; }
function blkText(v){ return blocks(v).map(b=>typeof b==='string'?b:b.list?b.list.join(''):b.table?[b.table.cap||''].concat(b.table.cols||[],...(b.table.rows||[])).join(''):'').join(''); }
function blkHTML(v){ return blocks(v).map(b=>{
  if(typeof b==='string') return `<p>${esc(b).replace(/\n/g,'<br>')}</p>`;
  if(b.list) return `<ul class="bl">${b.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(b.table){ const t=b.table, cols=t.cols||[], cap=t.cap?`<p class="tb-cap">${esc(t.cap)}</p>`:'';
    const rows=(t.rows||[]).map(r=> cols.length<=2
      ? `<div class="tb2"><b>${esc(r[0])}</b><span>${esc(r[1]??'')}</span></div>`
      : `<div class="tb-r"><p class="tb-h">${esc(r[0])}</p>${r.slice(1).map((c,i)=>`<p class="tb-c"><span>${esc(cols[i+1]||'')}</span>${esc(c)}</p>`).join('')}</div>`).join('');
    return `<div class="tb">${cap}${rows}</div>`; }
  return ''; }).join(''); }
function sumSecs(it){ const t=[blkText(it.summary),blkText(it.why),it.action,it.note].concat(it.detail||[]).filter(Boolean).join(''); return t.length*60/400; }
const sumMin=it=>Math.max(1,Math.round(sumSecs(it)/60));
function rowHTML(it,extra){
  const rd=!!S.read[it.id], sv=!!S.saved[it.id], op=!!S.open[it.id];
  return `<div class="row ${rd?'read':''} ${op?'open':''}" data-row="${esc(it.id)}">
  <button class="rt" type="button" data-toggle="${esc(it.id)}" aria-expanded="${op}"><span class="t">${esc(it.title)}</span>${extra||''}${sv?'<svg class="mk" aria-label="已收藏"><use href="#mark"/></svg>':''}<span class="mins">${sumMin(it)} 分</span></button>
  ${op?cardHTML(it):''}</div>`;
}
function cardHTML(it){
  const f=S.fb[it.id]||{}; const sv=!!S.saved[it.id];
  const orig=/[㐀-鿿]/.test(it.orig||'')?'':(it.orig?`<p class="orig">${esc(it.orig)}</p>`:'');
  const det=(it.detail||[]).length?`<details class="more"><summary>${it.detail.length} 個重點</summary><ul>${it.detail.map(x=>{const m=String(x).match(/^([^｜]{1,16})｜([\s\S]*)$/);return m?`<li><b>${esc(m[1])}</b>｜${esc(m[2])}</li>`:`<li>${esc(x)}</li>`}).join('')}</ul>${it.watch?`<p class="watch">${esc(it.watch)}</p>`:''}</details>`:'';
  const extra=(it.extra_links||[]).map(l=>`<a class="link-out" href="${esc(l.u)}" target="_blank" rel="noopener" data-src="${esc(it.id)}">${esc(l.t)} ↗</a>`).join('');
  const stars=[1,2,3,4,5].map(n=>`<button type="button" class="star ${f.stars>=n?'on':''}" data-star="${esc(it.id)}" data-n="${n}" aria-label="${n} 顆星" aria-pressed="${f.stars===n}">★</button>`).join('');
  return `<article class="card" data-id="${esc(it.id)}">${sv?'<svg class="flag" aria-hidden="true"><use href="#mark"/></svg>':''}
  ${orig}<div class="byline"><span class="src" data-clamp>${esc(it.media)}${it.author?'・'+esc(it.author):''}</span><span>${esc(it.date)}</span></div>
  <div class="prose blk">${blkHTML(it.summary)}</div>
  <div class="why"><span class="owl" aria-label="${it.qa?'回答':'跟我們的關係'}">🦉</span><div class="blk">${blkHTML(it.why)}</div></div>
  ${it.action?`<div class="act"><span class="tl">試試看</span>${esc(it.action)}</div>`:''}
  ${det}${it.note?`<p class="note">${esc(it.note)}</p>`:''}
  <div class="fb">
    <div class="line">${it.link?`<a class="link-out" href="${esc(it.link)}" target="_blank" rel="noopener" data-src="${esc(it.id)}">讀原文 ↗</a>`:''}${it.read?`<span class="omin">${it.read} 分</span>`:''}${extra}</div>
    <div class="rate"><div class="stars" role="group" aria-label="值得閱讀？"><span class="l">值得閱讀？</span>${stars}</div>
      <button class="savebtn" type="button" data-save="${esc(it.id)}" aria-pressed="${sv}"><svg aria-hidden="true"><use href="#mark"/></svg>${sv?'已收藏':'收藏'}</button></div>
    <textarea class="nbox" rows="1" placeholder="內容讀得慣嗎？想知道更多什麼？">${esc(f.note||'')}</textarea>
    <div class="line"><button class="btn" type="button" data-send="${esc(it.id)}">送出</button><span class="sent">${f.noteSent?'已送出':''}</span></div>
  </div></article>`;
}
function sectionsHTML(items,emptyAll){
  const secs=D.sections.filter(s=>secOn(s.id));
  const html=secs.map(s=>{const list=sortNew(items.filter(i=>i.sec===s.id)); if(!list.length) return '';
    return `<section class="sec" id="sec-${s.id}"><div class="sec-h"><h2>${esc(s.name)}</h2><span class="c">${list.length} 則</span></div><div class="list">${list.map(i=>rowHTML(i)).join('')}</div></section>`}).join('');
  return html||`<div class="empty">${emptyAll}</div>`;
}
function homeHTML(){
  const its=homeItems(); const unreadQA=myAnswers().filter(q=>!S.read[q.id]);
  const wk=D.weekly&&(D.weekly.items||[]).length?`<section class="box weekly"><div class="k">本週好讀</div><div class="list">${D.weekly.items.map(w=>{const it=byId(w.id);return it?rowHTML(it,`<span class="wk-s">★ ${w.stars} / ${w.n}人</span>`):''}).join('')}</div></section>`:'';
  return `<section class="intro"><div class="date">${esc(D.edition.label)}</div>
    <h1>${greet()}${S.name?'，'+esc(S.name):''}</h1>
    <p>${esc((D.intro||'').replace('{n}',D.edition.no))}</p>
    ${unreadQA.length?`<button class="notice" type="button" data-go="qa">● 你的問題有回答了，去看看</button>`:''}</section>
  ${wk}
  ${(D.keys||[]).length?`<section class="box keys"><div class="k">本期重點整理</div><ol>${D.keys.map(k=>`<li>${esc(k)}</li>`).join('')}</ol></section>`:''}
  ${sectionsHTML(its,'<b>這一期還沒有內容</b>')}
  ${askHTML()}
  <p class="foot">每天早上 7:30 cotori 會更新一次，搜羅各大咖啡媒體平台與新聞資源，內容是依原文整理的繁中摘要，資訊以原文為準。如有錯誤請不吝回饋修正，共同養成 cotori。</p>`;
}
const greet=()=>{const h=tpe(Date.now()).getHours();return h<11?'早安':h<18?'午安':'晚安'};
function askHTML(){ return `<section class="ask"><h2>🙋🏼 我有問題</h2><p>咖啡、餐飲、世間一切，任何想知道的都可以問。下一期會搜集新聞、研究報告來回答，所有人都看得到。</p>
    <textarea id="askBox" rows="2" placeholder="問吧！其他人也想知道"></textarea>
    <div class="line"><button class="btn primary" type="button" id="askSend">送出問題</button><span class="sent" id="askSent"></span></div></section>`; }
/* my own questions are matched by the send id kept on this phone; names are never shown */
const sidsOf=q=>String(q.sid||'').split(/\s+/).filter(Boolean);
function myAnswers(){ const mine=new Set(S.asked.map(a=>a.sid).filter(Boolean)); return (D.qa||[]).filter(q=>sidsOf(q).some(x=>mine.has(x))); }
function qaHTML(){
  const qa=D.qa||[]; const answered=new Set(qa.flatMap(sidsOf));
  const pending=S.asked.filter(a=>a.sid?!answered.has(a.sid):!qa.some(q=>q.title===a.text));
  /* newest first; a follow-up thread sits where its newest answer is and folds open/closed */
  const blocks=[],seen={};
  for(const q of qa){ if(!q.thread){blocks.push({q});continue}
    if(!seen[q.thread]){seen[q.thread]={thread:q.thread,list:[]};blocks.push(seen[q.thread]);} seen[q.thread].list.push(q); }
  const body=blocks.map(b=>{ if(b.q) return rowHTML(b.q);
    const un=b.list.filter(x=>!S.read[x.id]).length; const open=S.thOpen[b.thread]??un>0;
    return `<div class="row thread ${open?'open':''}"><button class="rt th" type="button" data-thread="${esc(b.thread)}" aria-expanded="${open}"><span class="t">${esc(b.thread)}</span><span class="mins">${b.list.length} 題${un?` · ${un} 未讀`:''}</span><span class="chev">${open?'－':'＋'}</span></button>${open?`<div class="list sub">${b.list.map(x=>rowHTML(x)).join('')}</div>`:''}</div>`; }).join('');
  return `<h1 class="view-h">大家問</h1><p class="view-sub">大家的提問，每天早上的新一期一起回答，一天最多 5 題，沒答完的隔天繼續。</p>`+askHTML()+
   (pending.length?`<div class="pend"><div class="k">你問的，排隊回答中</div>${pending.map(a=>`<p>${esc(a.text)}</p>`).join('')}</div>`:'')+
   (qa.length?`<div class="list qa-list">${body}</div>`:`<div class="empty"><b>還沒有人提問</b>在上面寫下你的問題，下一期就會在這裡回答。</div>`);
}
function chipsHTML(items){
  const have=new Set(items.map(i=>i.sec));
  return D.sections.filter(s=>secOn(s.id)&&have.has(s.id)).map(s=>`<a href="#sec-${s.id}" data-sec="${s.id}">${esc(s.name)}</a>`).join('');
}
function render(){
  if(!D) return; const m=$('#main'); let items=[];
  if(S.view==='home'){items=homeItems();m.innerHTML=homeHTML();}
  else if(S.view==='older'){items=olderItems();m.innerHTML=`<h1 class="view-h">3 天前</h1><p class="view-sub">4 到 30 天前的文章。收藏的不會出現在這裡，在「收藏」。</p>`+sectionsHTML(items,'<b>還沒有 3 天前的文章</b>');}
  else if(S.view==='saved'){items=savedItems();m.innerHTML=`<h1 class="view-h">收藏</h1><p class="view-sub">收藏的文章存在這支手機上，取消收藏前都會在。</p>`+sectionsHTML(items,'<b>還沒有收藏</b>點開任何一篇，按「收藏」就會留在這裡。');}
  else m.innerHTML=qaHTML();
  $('#chips').innerHTML=S.view==='qa'?'':chipsHTML(items); $('#chips').hidden=S.view==='qa';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===S.view));
  badges(); clampSrc(); spyChips(); watchRead();
}
function badges(){const n=unreadCount();const b=$('#unread');b.hidden=!n;b.textContent=n;
  const qn=(D.qa||[]).filter(q=>!S.read[q.id]).length; const qb=$('#qaUnread'); qb.hidden=!qn; qb.textContent=qn; }
function clampSrc(){document.querySelectorAll('.src[data-clamp]').forEach(s=>{if(s.scrollHeight<=s.clientHeight+2){s.removeAttribute('data-clamp');s.style.cursor='auto'}})}
let co=null;
function spyChips(){ if(co) co.disconnect(); const secs=[...document.querySelectorAll('.sec')]; if(!secs.length) return;
  co=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.slice(4);document.querySelectorAll('.chips a').forEach(a=>a.classList.toggle('on',a.dataset.sec===id))}}),{rootMargin:'-35% 0px -55% 0px'});
  secs.forEach(s=>co.observe(s)); }

/* read detection: the card was opened and scrolled to its end */
const openedAt={}; let ro=null;
function watchRead(){ if(ro) ro.disconnect(); if(!('IntersectionObserver' in window)) return;
  ro=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting) return; const id=e.target.closest('.card').dataset.id; tryRead(id,true);}),{threshold:.9});
  document.querySelectorAll('.card .fb').forEach(x=>ro.observe(x)); }
const seenEnd={};
function tryRead(id,end){ if(end) seenEnd[id]=true; const it=byId(id); if(!it||S.read[id]||!seenEnd[id]||!openedAt[id]) return;
  markRead(id,Math.round((Date.now()-openedAt[id])/1000)); }
function markRead(id,secs){ if(S.read[id]) return; S.read[id]=Date.now(); ls.set('k-read',S.read);
  const it=byId(id); send({type:'read',itemId:id,sec:it?it.sec:'',secs:secs||''});
  document.querySelectorAll('[data-row="'+CSS.escape(id)+'"]').forEach(r=>r.classList.add('read')); badges(); threadCounts(); }
/* keep the 'x 未讀' on thread headers in step with what has been read */
function threadCounts(){ document.querySelectorAll('[data-thread]').forEach(b=>{const k=b.dataset.thread; const list=(D.qa||[]).filter(q=>q.thread===k); const un=list.filter(q=>!S.read[q.id]).length; const m=b.querySelector('.mins'); if(m) m.textContent=list.length+' 題'+(un?' · '+un+' 未讀':'');}); }

/* onboarding & settings */
const PRIV=`<div class="priv"><b>同步什麼</b>：已讀、收藏、星評、字級、想看的分類。<ul><li>閱讀統計（讀完、點原文）照舊匿名，跟同步資料分開，不拿來排名或考核。</li><li>之後開的「個人新聞部」只有你看得到；Ben 只看得到部名。</li></ul></div>`;
const pinHTML=lab=>`<div class="fl">${lab}<div class="pin">${[0,1,2,3].map(i=>`<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN 第 ${i+1} 碼" data-pin="${i}">`).join('')}</div></div>`;
function wirePin(){ const ins=[...document.querySelectorAll('[data-pin]')];
  ins.forEach((el,i)=>{ el.addEventListener('input',()=>{ const v=el.value.replace(/\D/g,''); if(v.length>1){ v.slice(0,4).split('').forEach((c,j)=>{if(ins[j]) ins[j].value=c}); (ins[Math.min(3,v.length)]||el).focus(); return;}
      el.value=v; if(v&&ins[i+1]) ins[i+1].focus(); });
    el.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!el.value&&ins[i-1]){ins[i-1].focus();ins[i-1].value='';} }); }); }
const getPin=()=>[...document.querySelectorAll('[data-pin]')].map(x=>x.value).join('');
const picksHTML=()=>`<div style="font-size:.875rem;font-weight:700">想看的內容</div><div class="picks">${D.sections.map(s=>`<label class="pick"><input type="checkbox" value="${s.id}" ${secOn(s.id)?'checked':''}><span>${esc(s.name)}</span></label>`).join('')}</div>`;
const picked=()=>[...document.querySelectorAll('.picks input:checked')].map(x=>x.value);
const HOME_TIP='<p class="sm">放到手機主畫面：iPhone 用 Safari 打開，按「分享」→「加入主畫面」。</p>';
function sheetOpen(html){ $('#sheet').innerHTML=html; $('#scrim').hidden=false; wirePin(); }
function sheetClose(){ $('#scrim').hidden=true; }
function setPrefs(secs){ S.secs=secs; S.prefsT=Date.now(); ls.set('k-prefs-t',S.prefsT); ls.set('k-secs',secs); }
function syncErr(r){ return ({exists:'這個代稱已經有人設定過同步。是你本人的話，選「已經有帳號」輸入 PIN。',badpin:'PIN 不對，再試一次',noone:'找不到這個代稱，確認一下寫法，或選「初次使用」',bad:'代稱和 4 位數 PIN 都要填',net:'連不上，確認網路後再試'})[r&&r.err]||'同步沒成功，稍後再試'; }

/* first open: 初次使用 / 已經有帳號 */
function openWelcome(mode){ mode=mode||'new';
  sheetOpen(`<h2>歡迎</h2><p>每天早上一期，咖啡、餐飲和藝術的新知。</p>
   <div class="seg" role="group"><button type="button" data-mode="new" aria-pressed="${mode==='new'}">初次使用</button><button type="button" data-mode="login" aria-pressed="${mode==='login'}">已經有帳號</button></div>
   <label class="f">${mode==='new'?'你的名字（也是同步用的代稱）':'你的代稱'}<input type="text" id="fName" maxlength="20" placeholder="例如：小明" value="${esc(S.name)}" autocomplete="nickname"></label>
   ${pinHTML(mode==='new'?'設一組 PIN（4 位數）':'PIN')}
   ${mode==='new'?PRIV+picksHTML():'<p class="sm">登入後會把已讀、收藏、星評都帶過來。</p>'}
   <button class="btn primary" type="button" id="fGo">${mode==='new'?'開始讀':'接著讀'}</button>
   ${mode==='new'?HOME_TIP:'<p class="sm">忘記 PIN：跟 Ben 說，他幫你重設。</p>'}`);
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.name=$('#fName').value.trim();openWelcome(b.dataset.mode)});
  $('#fGo').onclick=async()=>{ const n=$('#fName').value.trim(), pin=getPin(); if(!n){$('#fName').focus();toast('請先寫名字');return}
    if(!/^\d{4}$/.test(pin)){toast('PIN 要 4 位數字');return}
    if(mode==='new'){ const p=picked(); if(!p.length){toast('至少勾一個');return}
      S.name=n; ls.set('k-name',n); setPrefs(p);
      const r=await Sync.start('register',n,pin);
      if(r.ok){sheetClose();render();toast('歡迎，'+n);}
      else if(r.err==='net'){sheetClose();render();toast('歡迎，'+n+'（同步晚點再設定）');}
      else toast(syncErr(r));
    } else { const r=await Sync.start('sync',n,pin); if(r.ok){sheetClose();render();toast('歡迎回來，'+S.name);} else toast(syncErr(r)); }
    flush(); };
}

/* already a reader on this phone: set up sync once */
function openSync(loginMode){
  sheetOpen(`<h2>${loginMode?'登入並合併':'設定同步'}</h2><p>${loginMode?'這個代稱已經在別台設定過。輸入那組 PIN，兩台的紀錄會合在一起。':'換手機、用電腦也能接著讀。設一組 4 位數 PIN 就好，你在這台的紀錄會一起帶上去。'}</p>
   <label class="f">你的代稱（就是你的名字）<input type="text" id="fName" maxlength="20" value="${esc(S.name)}" autocomplete="nickname"></label>
   ${pinHTML(loginMode?'PIN':'設一組 PIN（4 位數）')}
   ${PRIV}<button class="btn primary" type="button" id="fGo">${loginMode?'登入並合併':'開始同步'}</button>
   <button class="lk" type="button" id="fLater">先不要，下次再說</button>
   <p class="sm">忘記 PIN：跟 Ben 說，他幫你重設。</p>`);
  $('#fLater').onclick=()=>{ls.set('k-sync-later',Date.now());sheetClose();};
  $('#fGo').onclick=async()=>{ const n=$('#fName').value.trim(), pin=getPin(); if(!n){toast('請先寫名字');return} if(!/^\d{4}$/.test(pin)){toast('PIN 要 4 位數字');return}
    const r=await Sync.start(loginMode?'sync':'register',n,pin);
    if(r.ok){sheetClose();render();toast('同步好了');}
    else if(r.err==='exists'){openSync(true);toast('這個代稱已經設定過，輸入那組 PIN 就能合併');}
    else toast(syncErr(r)); };
}

/* settings */
function openSheet(first){ if(first) return openWelcome('new');
  const on=Sync.on();
  sheetOpen(`<h2>設定</h2>
   ${on?`<div class="fl">你的名字<div style="font-size:1.0625rem;font-weight:500">${esc(S.name)}</div></div>`:`<label class="f">你的名字<input type="text" id="fName" maxlength="20" value="${esc(S.name)}" autocomplete="nickname"></label>`}
   <div class="syst"><span><span class="dot ${on?'':'off'}"></span>${on?'已同步・'+Sync.when():'這台還沒設定同步'}</span>${on?'<button class="lk" type="button" id="fOut">登出這台</button>':'<button class="lk" type="button" id="fSync">設定同步</button>'}</div>
   ${picksHTML()}
   <button class="btn primary" type="button" id="fSave">儲存</button>
   <p class="sm">${on?'換新裝置：打開 cotori →「已經有帳號」→ 輸入代稱和 PIN。':'設定同步後，換手機、用電腦也能接著讀。'}</p>${HOME_TIP}`);
  if($('#fSync')) $('#fSync').onclick=()=>openSync(false);
  if($('#fOut')) $('#fOut').onclick=()=>{ Sync.logout(); };
  $('#fSave').onclick=()=>{ const n=on?S.name:$('#fName').value.trim(); if(!n){$('#fName').focus();toast('請先寫名字');return}
    const p=picked(); if(!p.length){toast('至少勾一個');return}
    S.name=n; ls.set('k-name',n); setPrefs(p); sheetClose(); render(); toast('已儲存'); flush(); };
}

/* cross-device sync: 代稱 + PIN. The server keeps one bundle per person and merges it with this phone's copy. */
const Sync=(()=>{ let acct=ls.get('k-sync',null), last=ls.get('k-sync-at',0), timer=null, running=false, again=false, applying=false;
  const KEYS=['k-read','k-svt','k-svdel','k-fb','k-asked','k-prefs-t'];
  async function hashOf(name,pin){ const t=new TextEncoder().encode('cotori|'+name.trim().toLowerCase()+'|'+pin);
    const b=await crypto.subtle.digest('SHA-256',t); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  function collect(){ const saved={};
    Object.keys(S.saved).forEach(id=>saved[id]={t:S.svt[id]||1,it:S.saved[id]});
    Object.keys(S.svdel).forEach(id=>{ if(!S.saved[id]) saved[id]={t:S.svdel[id],del:1}; });
    return {v:1,read:S.read,saved,fb:S.fb,asked:S.asked,prefs:S.secs?{secs:S.secs,scale:Number(ls.get('k-scale',1)),t:S.prefsT||1}:null}; }
  function apply(st){ if(!st) return false; const before=JSON.stringify(collect()); applying=true;
    try{ S.read=st.read||{}; S.saved={}; S.svt={}; S.svdel={};
      Object.keys(st.saved||{}).forEach(id=>{const x=st.saved[id]; if(x.del) S.svdel[id]=x.t; else if(x.it){S.saved[id]=x.it; S.svt[id]=x.t;}});
      S.fb=st.fb||{}; S.asked=st.asked||[];
      if(st.prefs){ S.secs=st.prefs.secs||S.secs; S.prefsT=st.prefs.t||0; if(st.prefs.scale) ls.set('k-scale',st.prefs.scale); ls.set('k-secs',S.secs); ls.set('k-prefs-t',S.prefsT); }
      ls.set('k-read',S.read); ls.set('k-saved',S.saved); ls.set('k-svt',S.svt); ls.set('k-svdel',S.svdel); ls.set('k-fb',S.fb); ls.set('k-asked',S.asked);
    } finally { applying=false; }
    return JSON.stringify(collect())!==before; }
  async function call(type,name,h){ if(!FEEDBACK_URL||!navigator.onLine) return {ok:false,err:'net'};
    try{ const r=await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type,name,h,state:collect()})}); return await r.json(); }
    catch(e){ return {ok:false,err:'net'}; } }
  function done(r){ last=Date.now(); ls.set('k-sync-at',last); if(r.name){S.name=r.name; ls.set('k-name',r.name);} return apply(r.state); }
  async function start(type,name,pin){ const h=await hashOf(name,pin); const r=await call(type,name,h);
    if(r.ok){ acct={name:r.name||name,h}; ls.set('k-sync',acct); done(r); applyScaleFromStore(); } return r; }
  async function run(){ if(!acct) return; if(running){again=true;return} running=true;
    const r=await call('sync',acct.name,acct.h); running=false;
    if(r.ok){ const changed=done(r); if(changed){ applyScaleFromStore(); if(!document.querySelector('.row.open')) render(); else syncBadges(); } }
    else if(r.err==='badpin'||r.err==='noone'){ acct=null; ls.set('k-sync',null); toast(r.err==='noone'?'同步帳號被重設了，請重新設定同步':'PIN 已經改過，請重新登入'); }
    if(again){again=false; run();} }
  function sched(ms){ if(!acct) return; clearTimeout(timer); timer=setTimeout(run,ms==null?2500:ms); }
  window.__cotoriSyncHook=k=>{ if(!applying&&acct&&(KEYS.includes(k)||k==='k-saved'||k==='k-secs'||k==='k-scale')){ if(k==='k-scale'&&!applying){S.prefsT=Date.now();try{localStorage.setItem('k-prefs-t',JSON.stringify(S.prefsT))}catch(e){}} sched(); } };
  document.addEventListener('visibilitychange',()=>{ if(!acct) return; if(document.visibilityState==='hidden'){clearTimeout(timer); run();} else sched(300); });
  function when(){ if(!last) return '還沒'; const m=Math.round((Date.now()-last)/60000); return m<1?'剛剛':m<60?m+' 分鐘前':Math.round(m/60)+' 小時前'; }
  function logout(){ ['k-sync','k-sync-at','k-read','k-saved','k-svt','k-svdel','k-fb','k-asked','k-name','k-secs','k-prefs-t','k-sync-later'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}}); location.reload(); }
  return {on:()=>!!acct,start,run,sched,when,logout}; })();
function applyScaleFromStore(){ const i=STEPS.indexOf(Number(ls.get('k-scale',1))); if(i>=0&&i!==si){si=i;applyScale();} }
function syncBadges(){ try{ badges(); }catch(e){} }
$('#openSet').onclick=()=>D&&openSheet(false);
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim'&&S.name){ if($('#fLater')) ls.set('k-sync-later',Date.now()); $('#scrim').hidden=true;}});

/* events */
document.addEventListener('click',e=>{
  const th=e.target.closest('[data-thread]'); if(th){const k=th.dataset.thread; const open=th.getAttribute('aria-expanded')==='true'; S.thOpen[k]=!open; render(); return;}
  const tg=e.target.closest('[data-toggle]'); if(tg){const id=tg.dataset.toggle; const row=tg.closest('.row');
    if(S.open[id]){delete S.open[id]; row.outerHTML=rowHTML(byId(id), row.querySelector('.wk-s')?row.querySelector('.wk-s').outerHTML:'');}
    else{ /* only one article open at a time: close the others first, then bring this title to the top */
      document.querySelectorAll('.row.open[data-row]').forEach(r=>{const oid=r.dataset.row; delete S.open[oid]; const w=r.querySelector('.rt .wk-s'); r.outerHTML=rowHTML(byId(oid),w?w.outerHTML:'');});
      S.open={}; S.open[id]=1; openedAt[id]=Date.now(); const it=byId(id); if(it&&it.sec==='skip') send({type:'open_skip',itemId:id,sec:'skip'});
      const r2=tg.closest('.row')||row; const w=r2.querySelector('.rt .wk-s'); const holder=document.createElement('div'); r2.replaceWith(holder); holder.outerHTML=rowHTML(it,w?w.outerHTML:'');
      const opened=[...document.querySelectorAll('.row.open[data-row="'+CSS.escape(id)+'"]')][0]; if(opened) opened.scrollIntoView({block:'start'});}
    clampSrc(); watchRead(); return;}
  const src=e.target.closest('.src'); if(src&&(src.hasAttribute('data-clamp')||src.classList.contains('full'))){src.classList.toggle('full');return;}
  const lo=e.target.closest('[data-src]'); if(lo){send({type:'open_source',itemId:lo.dataset.src,sec:(byId(lo.dataset.src)||{}).sec||''});return;}
  const st=e.target.closest('[data-star]'); if(st){const id=st.dataset.star,n=Number(st.dataset.n);const it=byId(id);
    const f=S.fb[id]=Object.assign({},S.fb[id]); f.stars=f.stars===n?0:n; f.t=Date.now(); ls.set('k-fb',S.fb);
    send({type:'rating',itemId:id,title:it.title,stars:f.stars||'',text:''}); markRead(id);
    st.closest('.stars').querySelectorAll('.star').forEach(b=>{b.classList.toggle('on',Number(b.dataset.n)<=f.stars);b.setAttribute('aria-pressed',Number(b.dataset.n)===f.stars)}); return;}
  const sv=e.target.closest('[data-save]'); if(sv){const id=sv.dataset.save; const it=byId(id);
    if(S.saved[id]){delete S.saved[id];delete S.svt[id];S.svdel[id]=Date.now();toast('已取消收藏')}else{S.saved[id]=it;S.svt[id]=Date.now();delete S.svdel[id];send({type:'save',itemId:id,sec:it.sec});toast('已收藏')}
    ls.set('k-svt',S.svt);ls.set('k-svdel',S.svdel);
    ls.set('k-saved',S.saved); const row=sv.closest('.row'); const wk=row.querySelector('.wk-s'); row.outerHTML=rowHTML(byId(id)||it,wk?wk.outerHTML:''); clampSrc(); watchRead(); return;}
  const sd=e.target.closest('[data-send]'); if(sd){const id=sd.dataset.send;const cd=sd.closest('.card');const t=cd.querySelector('.nbox').value.trim();if(!t){toast('先寫點什麼');return}
    const it=byId(id); const f=S.fb[id]=Object.assign({},S.fb[id],{note:t,noteSent:true,t:Date.now()}); ls.set('k-fb',S.fb);
    send({type:'note',itemId:id,title:it.title,stars:f.stars||'',text:t}); cd.querySelector('.sent').textContent='已送出'; toast('收到了，謝謝'); return;}
  if(e.target.id==='askSend'){const t=$('#askBox').value.trim(); if(!t){toast('先寫下你的問題');return}
    const sid=send({type:'question',itemId:'',title:'',stars:'',text:t}); S.asked.push({text:t,ts:Date.now(),sid}); ls.set('k-asked',S.asked);
    $('#askBox').value=''; $('#askSent').textContent='已送出，下一期回答'; toast('問題送出了'); return;}
  const tb=e.target.closest('.tab'); if(tb){S.view=tb.dataset.view;render();scrollTo(0,0);return;}
  const go=e.target.closest('[data-go]'); if(go){S.view=go.dataset.go;render();scrollTo(0,0);return;}
});
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800);}

/* saved copies refresh, and old unsaved state cleanup */
function tidy(){ (D.qa||[]).forEach(q=>q.qa=true); for(const id of Object.keys(S.saved)){const fresh=allIt().find(i=>i.id===id); if(fresh) S.saved[id]=fresh;} ls.set('k-saved',S.saved);
  const keep=new Set(allIt().map(i=>i.id).concat(Object.keys(S.saved))); for(const k of Object.keys(S.read)) if(!keep.has(k)) delete S.read[k]; ls.set('k-read',S.read); }

/* load & pull to refresh */
/* a category added later is switched on for everyone who already picked their categories */
function newSecs(){ const ids=D.sections.map(x=>x.id); const known=ls.get('k-known',['industry','science','fun','food','skip']);
  if(S.secs){const add=ids.filter(id=>!known.includes(id)&&!S.secs.includes(id)); if(add.length){S.secs=S.secs.concat(add);ls.set('k-secs',S.secs);}}
  ls.set('k-known',ids); }
/* the page itself (layout, features) may change too: compare its version tag with the one we started with and reload when it differs */
let pageTag=null;
async function tagNow(){ try{const r=await fetch('./index.html?t='+Date.now(),{method:'HEAD',cache:'no-store'}); return r.headers.get('etag')||r.headers.get('last-modified');}catch(e){return null} }
async function appChanged(){ const t=await tagNow(); return !!(pageTag&&t&&t!==pageTag); }
tagNow().then(t=>pageTag=t);
let lastCheck=Date.now();
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState!=='visible'||Date.now()-lastCheck<30000) return; lastCheck=Date.now();
  if(await appChanged()){location.reload();return} load().catch(()=>{}); });
async function load(){ const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'}); D=await r.json(); newSecs(); tidy(); render(); if(!S.name) openSheet(true); else if(Sync.on()) Sync.sched(0); else if(Date.now()-Number(ls.get('k-sync-later',0))>3*86400000 && $('#scrim').hidden) openSync(false); flush(); }
load().catch(()=>{$('#main').innerHTML='<p class="empty"><b>暫時打不開</b>請確認網路後再往下拉重新整理。</p>'});
let y0=null,pulled=0,busy=false; const ptr=$('#ptr');
addEventListener('touchstart',e=>{ if(scrollY<=0&&!busy&&$('#scrim').hidden) y0=e.touches.length===1?e.touches[0].clientY:null; else y0=null; },{passive:true});
addEventListener('touchmove',e=>{ if(y0==null) return; pulled=Math.max(0,Math.min(110,(e.touches[0].clientY-y0)*.5)); ptr.style.transition='none'; ptr.style.height=pulled+'px'; ptr.classList.toggle('flap',pulled>60); },{passive:true});
addEventListener('touchend',async()=>{ if(y0==null) return; y0=null; ptr.style.transition='';
  if(pulled>60){busy=true; ptr.style.height='64px'; ptr.classList.add('flap'); try{ if(await appChanged()){location.reload();return} await load()}catch(e){toast('重新整理失敗，稍後再試')}
    setTimeout(()=>{ptr.classList.remove('flap');ptr.style.height='0';busy=false},500);} else {ptr.style.height='0';ptr.classList.remove('flap');}
  pulled=0; });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
